<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>MacArthur Immersive Walk Test (1:1) — raw WebXR</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #overlay {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    padding: 10px 12px; color: #fff;
    background: linear-gradient(rgba(0,0,0,.75), rgba(0,0,0,0));
    pointer-events: none;
  }
  #overlay .row { display: flex; gap: 8px; flex-wrap: wrap; pointer-events: auto; }
  button {
    pointer-events: auto; border: 0; border-radius: 10px; padding: 10px 14px;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  #btn-walk { background: #4caf7d; color: #fff; }
  #btn-walk:disabled { background: #555; color: #bbb; }
  #btn-exit-xr { background: #b05252; color: #fff; }
  #hud {
    margin-top: 8px; font-size: 12px; line-height: 1.5; white-space: pre-wrap;
    background: rgba(0,0,0,.55); border-radius: 8px; padding: 8px 10px;
    pointer-events: none; max-width: 560px; font-family: monospace;
  }
  #hint {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 13px; background: rgba(0,0,0,.6);
    padding: 8px 12px; border-radius: 20px; z-index: 10; white-space: nowrap;
  }
  #joystick-zone {
    position: fixed; right: 18px; bottom: 64px; width: 110px; height: 110px;
    border-radius: 50%; background: rgba(255,255,255,.12);
    border: 2px solid rgba(255,255,255,.35); z-index: 10; touch-action: none;
  }
  #joystick-knob {
    position: absolute; left: 50%; top: 50%; width: 48px; height: 48px;
    margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(255,255,255,.75);
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="overlay">
  <div class="row">
    <button id="btn-walk">Enter 1:1 Walk (WebXR)</button>
    <button id="btn-exit-xr" style="display:none;">Exit Walk</button>
  </div>
  <div id="hud">starting…</div>
</div>

<div id="joystick-zone"><div id="joystick-knob"></div></div>
<div id="hint">Drag to look · Joystick to glide · Walk button for real 1:1</div>
<canvas id="c"></canvas>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const hud = document.getElementById('hud');
const btnWalk = document.getElementById('btn-walk');
const btnExit = document.getElementById('btn-exit-xr');
const hint = document.getElementById('hint');
const zone = document.getElementById('joystick-zone');
const knob = document.getElementById('joystick-knob');

let renderer, scene, camera, rig;
let xrSession = null;
let xrSupported = false;
let modelsStatus = 'loading…';
let lastError = '';
// drag-look state (non-XR only)
let yaw = 0, pitch = 0;

window.addEventListener('error', (e) => {
  lastError = 'JS error: ' + (e.message || e.error);
});

function fmt(v) { return v.x.toFixed(2) + ', ' + v.y.toFixed(2) + ', ' + v.z.toFixed(2); }

function updateHud() {
  if (!renderer) { hud.textContent = 'starting…'; return; }
  const presenting = renderer.xr.isPresenting;
  let refType = 'n/a';
  try {
    refType = renderer.xr.getReferenceSpaceType ? renderer.xr.getReferenceSpaceType() : 'unknown';
  } catch (e) {}
  const view = new THREE.Vector3();
  camera.getWorldPosition(view);
  let raw = 'n/a (no XR session)';
  if (presenting) {
    try {
      const xrCam = renderer.xr.getCamera();
      const rp = new THREE.Vector3();
      xrCam.getWorldPosition(rp);
      raw = fmt(rp);
    } catch (e) { raw = 'unreadable: ' + e.message; }
  }
  hud.textContent =
    'Models: ' + modelsStatus + '\n' +
    'XR supported: ' + (xrSupported ? 'YES' : 'NO — joystick only here') + '\n' +
    'Session: ' + (xrSession ? 'ACTIVE' : 'inactive') +
    ' | presenting: ' + presenting + ' | refSpace: ' + refType + '\n' +
    'RAW tracking pos: ' + raw + '\n' +
    'View pos (world): ' + fmt(view) + '\n' +
    (lastError ? lastError + '\n' : '') +
    (xrSession ? 'Walk 2-3 steps — RAW tracking pos MUST change.' : 'Tap Walk, grant camera, then walk.');
}

// ---- three.js scene (same transforms as main app immersive) ----
renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');

scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);
camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
rig = new THREE.Group();
rig.position.set(0, 1.6, 0); // magic-window eye height; zeroed during XR (local-floor already has eye height)
rig.add(camera);
scene.add(rig);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
dirLight.position.set(-1, 2, 1);
scene.add(dirLight);

// Walk-test helpers: floor grid + 1m/2m markers so real steps are visible
const grid = new THREE.GridHelper(20, 20, 0x00ff88, 0x00ff88);
grid.position.y = 0.01;
grid.material.transparent = true;
grid.material.opacity = 0.35;
scene.add(grid);
function marker(color, z) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.06, 16, 16),
    new THREE.MeshBasicMaterial({ color })
  );
  m.position.set(0, 1, z);
  scene.add(m);
}
marker(0xff3333, -1);
marker(0x3388ff, -2);

// Same MacArthur assets/transforms as testnewgbr/app.js immersive mode
const loader = new GLTFLoader();
let pending = 2;
function doneOne(label) {
  pending--;
  modelsStatus = pending <= 0 ? 'ready' : label + ' loaded…';
}
loader.load('./assets/beachskybox.optimized.glb', (gltf) => {
  gltf.scene.position.set(0, 0, 0);
  gltf.scene.scale.set(100, 100, 100);
  scene.add(gltf.scene);
  doneOne('skybox');
}, undefined, (err) => { modelsStatus = 'skybox FAILED: ' + err.message; });
loader.load('./assets/mcarthur.optimized.glb', (gltf) => {
  gltf.scene.position.set(0, 0, -3);
  gltf.scene.rotation.set(0, THREE.MathUtils.degToRad(270), 0);
  gltf.scene.scale.set(3.5, 3.5, 3.5);
  scene.add(gltf.scene);
  doneOne('model');
}, undefined, (err) => { modelsStatus = 'model FAILED: ' + err.message; });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---- drag-to-look (non-XR only; ignored on joystick/overlay) ----
let dragging = false, lx = 0, ly = 0;
window.addEventListener('pointerdown', (e) => {
  if (e.target.closest && e.target.closest('#joystick-zone, #overlay, button')) return;
  dragging = true; lx = e.clientX; ly = e.clientY;
});
window.addEventListener('pointermove', (e) => {
  if (!dragging || renderer.xr.isPresenting) return;
  yaw -= (e.clientX - lx) * 0.005;
  pitch -= (e.clientY - ly) * 0.005;
  pitch = Math.max(-1.4, Math.min(1.4, pitch));
  lx = e.clientX; ly = e.clientY;
});
window.addEventListener('pointerup', () => { dragging = false; });
window.addEventListener('pointercancel', () => { dragging = false; });

// ---- joystick glide (moves rig; works in both modes) ----
const joy = { active: false, x: 0, y: 0, cx: 0, cy: 0, max: 40 };
zone.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  joy.active = true;
  const r = zone.getBoundingClientRect();
  joy.cx = r.left + r.width / 2; joy.cy = r.top + r.height / 2;
  joyMove(e.clientX, e.clientY);
  zone.setPointerCapture(e.pointerId);
});
zone.addEventListener('pointermove', (e) => {
  if (joy.active) { e.preventDefault(); joyMove(e.clientX, e.clientY); }
});
function joyEnd() {
  joy.active = false; joy.x = 0; joy.y = 0;
  knob.style.transform = 'translate(0px, 0px)';
}
zone.addEventListener('pointerup', joyEnd);
zone.addEventListener('pointercancel', joyEnd);
function joyMove(x, y) {
  let dx = x - joy.cx, dy = y - joy.cy;
  const d = Math.hypot(dx, dy);
  if (d > joy.max) { dx *= joy.max / d; dy *= joy.max / d; }
  knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  joy.x = dx / joy.max; joy.y = dy / joy.max;
}
const UP = new THREE.Vector3(0, 1, 0);
function tickJoystick(dt) {
  if (!joy.active) return;
  const fwd = new THREE.Vector3();
  camera.getWorldDirection(fwd); fwd.y = 0;
  if (fwd.lengthSq() < 1e-6) fwd.set(0, 0, -1); else fwd.normalize();
  const right = new THREE.Vector3().crossVectors(fwd, UP).normalize();
  // push up = forward, push right = strafe right
  const s = 0.004 * dt;
  rig.position.addScaledVector(fwd, -joy.y * s);
  rig.position.addScaledVector(right, joy.x * s);
}

// ---- render loop ----
let lastT = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min(100, now - lastT);
  lastT = now;
  if (!renderer.xr.isPresenting) {
    rig.rotation.set(0, yaw, 0);
    camera.rotation.set(pitch, 0, 0);
  }
  tickJoystick(dt);
  renderer.render(scene, camera);
});
setInterval(updateHud, 500);

// ---- WebXR session ----
async function checkSupport() {
  if (!('xr' in navigator)) {
    btnWalk.disabled = true;
    btnWalk.textContent = 'WebXR not in this browser';
    updateHud();
    return;
  }
  try {
    xrSupported = await navigator.xr.isSessionSupported('immersive-ar');
  } catch (e) { xrSupported = false; }
  if (!xrSupported) {
    btnWalk.disabled = true;
    btnWalk.textContent = '1:1 Walk not supported here';
  }
  updateHud();
}

renderer.xr.addEventListener('sessionstart', () => {
  rig.position.set(0, 0, 0); // local-floor: y=0 is the floor, pose already includes eye height
  rig.rotation.set(0, 0, 0);
  yaw = 0; pitch = 0;
  btnExit.style.display = 'inline-block';
  btnWalk.disabled = true;
  hint.textContent = 'Walk in real life — RAW tracking pos must change';
  updateHud();
});
renderer.xr.addEventListener('sessionend', () => {
  xrSession = null;
  rig.position.set(0, 1.6, 0);
  rig.rotation.set(0, 0, 0);
  yaw = 0; pitch = 0;
  btnExit.style.display = 'none';
  btnWalk.disabled = !xrSupported;
  hint.textContent = 'Drag to look · Joystick to glide · Walk button for real 1:1';
  updateHud();
});

btnWalk.addEventListener('click', async () => {
  lastError = '';
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
      try { await DeviceOrientationEvent.requestPermission(); } catch (e) {}
    }
    xrSession = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['local-floor'],
      optionalFeatures: ['hit-test']
    });
    await renderer.xr.setSession(xrSession);
  } catch (err) {
    xrSession = null;
    lastError = 'Walk start failed: ' + (err && err.message ? err.message : err);
    updateHud();
  }
});
btnExit.addEventListener('click', async () => {
  try { if (xrSession) await xrSession.end(); } catch (e) {}
});

checkSupport();
updateHud();
</script>
</body>
</html>
